{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container" style="max-width:440px;">
  <div class="card" style="margin-top:2rem;">
    <h2 style="margin-bottom:1.5rem;">🔐 Login</h2>
    <form method="POST">
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" name="identifier" required placeholder="Username or email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Your password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Login 🌿</button>
    </form>
    <p style="margin-top:1rem;text-align:center;font-size:0.9rem;color:var(--taupe);">
      New here? <a href="{{ url_for('register') }}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
